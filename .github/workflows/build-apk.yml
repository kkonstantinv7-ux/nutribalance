name: Build NutriBalance Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Capacitor 8 Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Privacy Policy</title></head><body><h1>NutriBalance</h1><p>Данные Health Connect используются только в личном дневнике питания пользователя.</p></body></html>' > www/privacypolicy.html
          npm init -y
          npm install @capacitor/core@^8.0.0 @capacitor/cli@^8.0.0 @capacitor/android@^8.0.0 @capgo/capacitor-health@^8.0.0 --legacy-peer-deps
          npx cap init "NutriBalance" "com.konstantin.nutribalance" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload NutriBalance.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriBalance-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
